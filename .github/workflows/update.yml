name: 更新并部署《求是》考点站

on:
  schedule:
    # 每天北京时间 09:30 自动同步（UTC 01:30）。《求是》每月 1 日、16 日前后出新刊
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "dist/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖与中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk || true
          pip install -r requirements.txt

      - name: 抓取最新期次（增量）
        run: python scripts/scrape.py

      - name: 生成要点提炼（未配置 LLM_API_KEY 则跳过）
        if: env.LLM_API_KEY != ''
        run: python scripts/make_digest.py --missing

      - name: 生成站点
        run: python scripts/build_site.py --out dist

      - name: 生成 PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python scripts/build_pdf.py --dist dist

      - name: 回写数据到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 同步 $(date +'%Y-%m-%d') 《求是》最新期次 [skip ci]"
          # 期间若有人手动推送过，先变基再推，避免非快进被拒
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
